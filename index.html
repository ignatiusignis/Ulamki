let chapter=0,target=0;let page='home',previous='home',mode='',q,index=0,score=0,answers=[],values=['',''],active=0,step=0,locked=false,feedback='',wrong=false;
function theme(v){document.documentElement.classList.toggle('light',v==='light');try{localStorage.setItem('ulamki-theme',v)}catch(e){}}

$('back').onclick=()=>go(page==='settings'?previous:page==='home'?'home':page==='modes'?'home':'modes');

const rand=n=>Math.floor(Math.random()*n);

function reset(){if(chapter===3){resetMixed();return}if(chapter===2){resetEquiv();return}q=question();target=count();if(chapter===1)q.parts.fill(false);values=['',''];active=0;step=0;locked=false;feedback='';wrong=false}

function key(k){if(page!=='play'||locked||!['train','quiz'].includes(mode))return;if(chapter===2&&q.fixed!==null){active=1-q.fixed;if(k==='swap')return}if(k==='swap')active=chapter===3?(active+1)%values.length:1-active;else if(k==='C')values[active]='';else if(k==='⌫')values[active]=values[active].slice(0,-1);else if(/^\d$/.test(k))values[active]=(values[active]+k).slice(0,3);feedback='';render()}
function check(){if(chapter===3){checkMixed();return}if(chapter===2){checkEquiv();return}if(locked||values.some(v=>v==='')||Number(values[1])===0){feedback='Wpisz licznik i mianownik większy od zera.';wrong=true;render();return}const ok=Number(values[0])===count()&&Number(values[1])===q.d;if(mode==='train'&&!ok){feedback='Spróbuj jeszcze raz. Policz wszystkie części i zamalowane części.';wrong=true;render();return}score+=Number(ok);answers.push({given:values.join('/'),expected:count()+'/'+q.d,ok});locked=true;feedback=mode==='quiz'?'Odpowiedź zapisana.':'Brawo! Poprawna odpowiedź.';wrong=false;render()}

function render(){if(page==='home'){app.innerHTML='<h2>Wybierz dział</h2><div class="menu">'+chapters.map((c,i)=>'<button '+(i>3?'disabled':'data-chapter="'+i+'"')+'>'+ (i+1)+'. '+c+(i>3?' · wkrótce':'')+'</button>').join('')+'</div>';app.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.chapter);go('modes')});return}

if(chapter===3){renderMixed();return}if(chapter===2){renderEquiv();return}if(chapter===1){renderMark();return}if(mode==='sandbox'){app.innerHTML='<div class="center"><h2>Piaskownica</h2><div class="controls"><label>Figura <select id="shape"><option value="circle">Koło</option><option value="rect">Prostokąt</option><option value="square">Kwadrat</option></select></label><label>Części <select id="parts">'+Array.from({length:11},(_,i)=>'<option>'+(i+2)+'</option>').join('')+'</select></label></div>'+figure(true)+'<p>Kliknij część, aby zmienić jej kolor.</p>'+frac([String(count()),String(q.d)])+'</div>';$('shape').value=q.shape;$('parts').value=q.d;$('shape').onchange=e=>{q.shape=e.target.value;render()};$('parts').onchange=e=>{q.d=Number(e.target.value);q.parts=Array(q.d).fill(false);render()};app.querySelectorAll('[data-part]').forEach(el=>{const toggle=()=>{q.parts[Number(el.dataset.part)]=!q.parts[Number(el.dataset.part)];render()};el.onclick=toggle;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}});return}
if(mode==='learn'){const tips=['Figura jest podzielona na równe części.','Wszystkich części jest '+q.d+'. To mianownik – zapisujemy go pod kreską.','Zamalowanych części jest '+count()+'. To licznik – zapisujemy go nad kreską.','Odczytaliśmy ułamek: '+count()+'/'+q.d+'.'];app.innerHTML='<div class="center"><h2>Nauka – krok '+(step+1)+'/4</h2>'+figure()+frac([step>=2?String(count()):'',step>=1?String(q.d):''])+'<p class="feedback">'+tips[step]+'</p><div class="controls"><button id="prev" '+(!step?'disabled':'')+'>Wstecz</button><button id="advance">'+(step===3?'Nowy przykład':'Dalej')+'</button></div></div>';$('prev').onclick=()=>{step--;render()};$('advance').onclick=()=>{if(step===3)reset();else step++;render()};return}
app.innerHTML='<div class="center"><small>Zadanie '+(index+1)+'/'+(mode==='quiz'?5:10)+'</small><h2>Jaka część figury została zamalowana?</h2>'+figure()+frac(values)+'<div class="feedback '+(wrong?'bad':'good')+'" aria-live="polite">'+feedback+'</div><div class="keys">'+['7','8','9','4','5','6','1','2','3','C','0','⌫'].map(k=>'<button data-key="'+k+'" '+(locked?'disabled':'')+'>'+k+'</button>').join('')+'</div><button id="swap" '+(locked?'disabled':'')+'>↑ ↓ Zmień pole</button><p><button class="primary" id="submit">'+(locked?'Dalej':'Sprawdź')+'</button></p></div>';$('num').onclick=()=>{if(!locked){active=0;render()}};$('den').onclick=()=>{if(!locked){active=1;render()}};$('swap').onclick=()=>key('swap');$('submit').onclick=()=>locked?next():check();app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key))}
function shownFraction(n,d){return '<div class="fraction" aria-label="'+n+' przez '+d+'"><strong style="font-size:28px">'+n+'</strong><div class="bar"></div><strong style="font-size:28px">'+d+'</strong></div>'}
function bindParts(){app.querySelectorAll('[data-part]').forEach(el=>{const toggle=()=>{if(locked)return;const i=Number(el.dataset.part);q.parts[i]=!q.parts[i];feedback='';render();app.querySelector('[data-part="'+i+'"]')?.focus()};el.onclick=toggle;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}})}
function markCheck(){const ok=count()===target;if(mode==='train'&&!ok){feedback='Spróbuj jeszcze raz. Zamaluj tyle części, ile wskazuje licznik.';wrong=true;render();return}score+=Number(ok);answers.push({given:count()+'/'+q.d,expected:target+'/'+q.d,ok});locked=true;feedback=mode==='quiz'?'Odpowiedź zapisana.':'Brawo! Poprawna odpowiedź.';wrong=false;render()}
function renderMark(){if(mode==='learn'){const tips=['Mianownik wskazuje liczbę wszystkich równych części. Tutaj jest ich '+q.d+'.','Licznik wskazuje, ile części należy zamalować. Tutaj '+target+'.','Zamalowujemy kolejne części.','Gotowe! Zamalowaliśmy '+target+' z '+q.d+' części.'];const filled=count();const stage=step<2?step:filled<target?2:3;app.innerHTML='<div class="center"><h2>Nauka – zaznaczanie ułamka</h2>'+shownFraction(target,q.d)+figure()+'<p class="feedback">'+tips[stage]+(stage===2?' ('+filled+'/'+target+')':'')+'</p><div class="controls"><button id="prev" '+(!step?'disabled':'')+'>Wstecz</button><button id="advance">'+(stage===3?'Nowy przykład':'Dalej')+'</button></div></div>';$('prev').onclick=()=>{if(count()>0){q.parts[count()-1]=false}else step=Math.max(0,step-1);render()};$('advance').onclick=()=>{if(stage===3)reset();else if(step<2)step++;else q.parts[count()]=true;render()};return}
if(mode==='sandbox'){app.innerHTML='<div class="center"><h2>Piaskownica</h2><div class="controls"><label>Figura <select id="shape"><option value="circle">Koło</option><option value="rect">Prostokąt</option><option value="square">Kwadrat</option></select></label><label>Mianownik <select id="parts">'+Array.from({length:11},(_,i)=>'<option>'+(i+2)+'</option>').join('')+'</select></label><label>Licznik <select id="target">'+Array.from({length:q.d+1},(_,i)=>'<option>'+i+'</option>').join('')+'</select></label></div>'+shownFraction(target,q.d)+figure(true)+'<p>Zamalowano: '+count()+' z '+q.d+' części.</p><p class="feedback">'+(count()===target?'Ułamek zaznaczony poprawnie.':'Klikaj dowolne części figury.')+'</p><button id="clear">Wyczyść</button></div>';$('shape').value=q.shape;$('parts').value=q.d;$('target').value=target;$('shape').onchange=e=>{q.shape=e.target.value;render()};$('parts').onchange=e=>{q.d=Number(e.target.value);target=Math.min(target,q.d);q.parts=Array(q.d).fill(false);render()};$('target').onchange=e=>{target=Number(e.target.value);render()};$('clear').onclick=()=>{q.parts.fill(false);render()};bindParts();return}
app.innerHTML='<div class="center"><small>Zadanie '+(index+1)+'/'+(mode==='quiz'?5:10)+'</small><h2>Zamaluj odpowiednią część figury</h2>'+shownFraction(target,q.d)+figure(!locked)+'<p>Kliknij fragment, aby zmienić jego kolor.</p><div class="feedback '+(wrong?'bad':'good')+'" aria-live="polite">'+feedback+'</div><button id="clear" '+(locked?'disabled':'')+'>Wyczyść</button><p><button class="primary" id="submit">'+(locked?'Dalej':mode==='quiz'?'Zapisz odpowiedź':'Sprawdź')+'</button></p></div>';$('clear').onclick=()=>{q.parts.fill(false);feedback='';render()};$('submit').onclick=()=>locked?next():markCheck();bindParts()}
let range='mixed',sand={n:2,d:5,k:2,op:'expand'};
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function equivQuestion(prev,scope){const pool=[];for(let d=2;d<=10;d++)for(let n=1;n<d;n++)for(let k=2;k<=10;k++){if(scope!=='expand'&&gcd(n,d)===1)pool.push({n:n*k,d:d*k,a:n,b:d,k,kind:'reduce',fixed:null});if(scope!=='reduce'){pool.push({n,d,a:n*k,b:d*k,k,kind:'den',fixed:1},{n,d,a:n*k,b:d*k,k,kind:'num',fixed:0})}}const filtered=pool.filter(x=>!prev||(x.n*prev.d!==prev.n*x.d&&Math.abs(x.n/x.d-prev.n/prev.d)>=.12&&!(Math.abs(x.n-prev.n)<=1&&Math.abs(x.d-prev.d)<=1)));return filtered[rand(filtered.length)]}
function resetEquiv(){q=equivQuestion(q,range);values=['',''];if(q.fixed!==null)values[q.fixed]=String(q.fixed===0?q.a:q.b);active=q.fixed===0?1:0;step=0;locked=false;feedback='';wrong=false}
function checkEquiv(){if(locked)return;if(values.some(v=>!v)||Number(values[1])===0){feedback='Uzupełnij ułamek. Mianownik musi być większy od zera.';wrong=true;render();return}const ok=Number(values[0])===q.a&&Number(values[1])===q.b;if(!ok&&mode==='train'){feedback=q.kind==='reduce'?'Skróć ułamek do postaci nieskracalnej.':'Pomnóż licznik i mianownik przez tę samą liczbę.';wrong=true;render();return}score+=Number(ok);answers.push({given:values.join('/'),expected:q.a+'/'+q.b,ok});locked=true;wrong=false;feedback=mode==='quiz'?'Odpowiedź zapisana.':'Brawo! Poprawna odpowiedź.';render()}
function strip(n,d){let s='';for(let i=0;i<d;i++)s+='<rect x="'+(5+i*290/d)+'" y="5" width="'+290/d+'" height="36" fill="'+(i<n?'#438de0':'#e1e7ef')+'" stroke="#64748b" stroke-width=".7"/>';return '<svg viewBox="0 0 300 46" style="width:100%;max-width:440px" aria-label="'+n+' z '+d+' części">'+s+'</svg>'}
function equation(a,b){return '<div class="equation">'+a+'<strong>=</strong>'+b+'</div>'}
function instruction(){return q.kind==='reduce'?'Skróć ułamek do najprostszej postaci.':q.kind==='den'?'Rozszerz ułamek do mianownika '+q.b+'.':'Rozszerz ułamek do licznika '+q.a+'.'}
function renderEquiv(){if(mode==='sandbox'){const {n,d,k,op}=sand,valid=Number.isInteger(n)&&Number.isInteger(d)&&n>0&&n<d&&d<=120&&Number.isInteger(k)&&k>=2&&k<=10,ok=valid&&(op==='expand'||(n%k===0&&d%k===0)),a=op==='expand'?n*k:n/k,b=op==='expand'?d*k:d/k;app.innerHTML='<div class="center"><h2>Piaskownica</h2><div class="controls"><label>Licznik <input id="sn" type="number" min="1" max="119" value="'+n+'"></label><label>Mianownik <input id="sd" type="number" min="2" max="120" value="'+d+'"></label><label>Działanie <select id="op"><option value="expand">Rozszerzanie</option><option value="reduce">Skracanie</option></select></label><label>Przez <select id="sk">'+Array.from({length:9},(_,i)=>'<option>'+(i+2)+'</option>').join('')+'</select></label></div>'+(ok?equation(shownFraction(n,d),shownFraction(a,b))+(Math.max(d,b)<=120?strip(n,d)+strip(a,b):''):valid?'Nie można skrócić przez tę liczbę.':'Wpisz ułamek właściwy (mianownik do 120).')+'</div>';$('op').value=op;$('sk').value=k;for(const [id,p] of [['sn','n'],['sd','d'],['sk','k'],['op','op']])$(id).onchange=e=>{sand[p]=p==='op'?e.target.value:Number(e.target.value);render()};return}
if(mode==='learn'){const reduce=q.kind==='reduce',sign=reduce?' : ':' · ',tips=[instruction(),reduce?'Szukamy największego wspólnego dzielnika licznika i mianownika. Jest nim '+q.k+'.':'Ustalamy, przez ile trzeba pomnożyć '+(q.kind==='den'?'mianownik':'licznik')+'. Jest to '+q.k+'.', (reduce?'Dzielimy':'Mnożymy')+' licznik i mianownik przez '+q.k+'.','Wartość ułamka się nie zmieniła.'];app.innerHTML='<div class="center"><h2>Nauka – krok '+(step+1)+'/4</h2>'+strip(q.n,q.d)+shownFraction(q.n,q.d)+(step>=2?equation(shownFraction(q.n+sign+q.k,q.d+sign+q.k),shownFraction(step===3?q.a:'?',step===3?q.b:'?')):'')+(step===3?strip(q.a,q.b):'')+'<p class="feedback">'+tips[step]+'</p><div class="controls"><button id="prev" '+(!step?'disabled':'')+'>Wstecz</button><button id="advance">'+(step===3?'Nowy przykład':'Dalej')+'</button></div></div>';$('prev').onclick=()=>{step--;render()};$('advance').onclick=()=>{if(step===3)reset();else step++;render()};return}
app.innerHTML='<div class="center"><small>Zadanie '+(index+1)+'/'+(mode==='quiz'?5:10)+'</small><h2>'+instruction()+'</h2>'+equation(shownFraction(q.n,q.d),frac(values))+'<div class="feedback '+(wrong?'bad':'good')+'" aria-live="polite">'+feedback+'</div><div class="keys">'+['7','8','9','4','5','6','1','2','3','C','0','⌫'].map(k=>'<button data-key="'+k+'" '+(locked?'disabled':'')+'>'+k+'</button>').join('')+'</div><button id="swap" '+(locked||q.fixed!==null?'disabled':'')+'>↑ ↓ Zmień pole</button><p><button class="primary" id="submit">'+(locked?'Dalej':mode==='quiz'?'Zapisz odpowiedź':'Sprawdź')+'</button></p></div>';['num','den'].forEach((id,i)=>{$(id).disabled=locked||q.fixed===i;$(id).onclick=()=>{active=i;render()}});$('swap').onclick=()=>key('swap');$('submit').onclick=()=>locked?next():checkEquiv();app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key))}
let mixedSand={w:2,n:3,d:5,op:'expand',improper:13};
function mixedQuestion(prev,scope){const pool=[];for(const d of [2,3,4,5,6,7,8,9,10,12])for(let w=1;w<=20;w++)for(let n=1;n<d;n++){const total=w*d+n;if(total>250||!(w<=10&&d<=10||w*d<=50||[10,20,25,50,100].includes(d)&&w*d<=200||[10,20].includes(w)&&w*d<=200||[12,15].includes(d)&&w<=5))continue;if(prev&&(prev.total* d===total*prev.d||Math.abs(total/d-prev.total/prev.d)<.5||Math.abs(total-prev.total)<=1&&Math.abs(d-prev.d)<=1))continue;for(const kind of ['reduce','expand'])if(scope==='mixed'||scope===kind)pool.push({w,n,d,total,kind})}return pool[rand(pool.length)]}
function resetMixed(){q=mixedQuestion(q,range);values=q.kind==='reduce'?['','','']:['',''];active=0;step=0;locked=false;feedback='';wrong=false}
function mixedDisplay(w,n,d){return '<div class="mixed-number"><strong>'+w+'</strong>'+shownFraction(n,d)+'</div>'}
function mixedInput(){const f=(i,label)=>'<button data-field="'+i+'" aria-label="'+label+'" class="'+(active===i?'active':'')+'" '+(locked?'disabled':'')+'>'+ (values[i]||'?')+'</button>';return q.kind==='reduce'?'<div class="mixed-number"><div class="fraction whole-field">'+f(0,'Całości')+'</div><div class="fraction">'+f(1,'Licznik')+'<div class="bar"></div>'+f(2,'Mianownik')+'</div></div>':'<div class="fraction">'+f(0,'Licznik')+'<div class="bar"></div>'+f(1,'Mianownik')+'</div>'}
function mixedExpected(){return q.kind==='reduce'?[q.w,q.n,q.d]:[q.total,q.d]}
function mixedFormat(v){return v.length===3?v[0]+' '+v[1]+'/'+v[2]:v.join('/')}
function checkMixed(){if(locked)return;if(values.some(v=>!v)||Number(values[values.length-1])===0){feedback='Uzupełnij wszystkie pola. Mianownik nie może być zerem.';wrong=true;render();return}const expected=mixedExpected(),ok=expected.every((v,i)=>v===Number(values[i]));if(!ok&&mode==='train'){feedback=q.kind==='reduce'?'Podziel licznik przez mianownik. Pamiętaj o reszcie i zachowaj mianownik.':'Pomnóż całości przez mianownik i dodaj licznik. Zachowaj mianownik.';wrong=true;render();return}score+=Number(ok);answers.push({given:mixedFormat(values),expected:mixedFormat(expected),ok});locked=true;wrong=false;feedback=mode==='quiz'?'Odpowiedź zapisana.':'Brawo! Poprawna odpowiedź.';render()}
function mixedPicture(w,n,d){const tile=(a,label)=>'<figure>'+strip(a,d).replace('300 46','300 90').replaceAll('height="36"','height="80"')+'<figcaption>'+label+'</figcaption></figure>';return '<div class="mixed-picture">'+Array.from({length:Math.min(w,10)},()=>tile(d,'1 całość')).join('')+(w>10?'<p>… jeszcze '+(w-10)+' całych</p>':'')+(n?tile(n,n+' z '+d+' części'):'')+'</div>'}
function renderMixed(){if(mode==='sandbox'){const s=mixedSand,reduce=s.op==='reduce',valid=Number.isInteger(s.d)&&s.d>=2&&s.d<=12&&(reduce?Number.isInteger(s.improper)&&s.improper>s.d&&s.improper<=250:Number.isInteger(s.w)&&s.w>=1&&s.w<=20&&Number.isInteger(s.n)&&s.n>=1&&s.n<s.d),w=reduce?Math.floor(s.improper/s.d):s.w,n=reduce?s.improper%s.d:s.n,total=reduce?s.improper:w*s.d+n;app.innerHTML='<div class="center"><h2>Piaskownica</h2><label>Działanie <select id="mop"><option value="reduce">Wyciąganie całości</option><option value="expand">Wciąganie całości</option></select></label><div class="controls">'+(reduce?'<label>Licznik <input id="mi" type="number" value="'+s.improper+'"></label>':'<label>Całości <input id="mw" type="number" value="'+s.w+'"></label><label>Licznik <input id="mn" type="number" value="'+s.n+'"></label>')+'<label>Mianownik <input id="md" type="number" value="'+s.d+'"></label></div>'+(valid?equation(reduce?shownFraction(total,s.d):mixedDisplay(w,n,s.d),reduce?(n?mixedDisplay(w,n,s.d):'<strong>'+w+'</strong>'):shownFraction(total,s.d))+mixedPicture(w,n,s.d)+'<p>'+(reduce?total+' : '+s.d+' = '+w+' reszty '+n:w+' · '+s.d+' + '+n+' = '+total)+'</p>':'Wprowadź poprawne liczby: mianownik 2–12, całości 1–20, licznik ułamka właściwego mniejszy od mianownika.')+'</div>';$('mop').value=s.op;for(const [id,p] of [['mop','op'],['mi','improper'],['mw','w'],['mn','n'],['md','d']])if($(id))$(id).onchange=e=>{s[p]=p==='op'?e.target.value:Number(e.target.value);render()};return}
const reduce=q.kind==='reduce',source=reduce?shownFraction(q.total,q.d):mixedDisplay(q.w,q.n,q.d),instruction=reduce?'Wyciągnij całości z ułamka.':'Wciągnij całości do ułamka.';
if(mode==='learn'){const tips=reduce?[instruction,'Dzielimy licznik przez mianownik: '+q.total+' : '+q.d+' = '+q.w+' reszty '+q.n+'.','Wynik dzielenia to całości, reszta to licznik. Mianownik pozostaje bez zmian.','Zapisujemy liczbę mieszaną.']: [instruction,'Każda całość to '+q.d+'/'+q.d+'. Mnożymy '+q.w+' · '+q.d+' = '+q.w*q.d+'.','Dodajemy licznik: '+q.w*q.d+' + '+q.n+' = '+q.total+'.','Zapisujemy ułamek niewłaściwy. Mianownik pozostaje bez zmian.'];app.innerHTML='<div class="center"><h2>Nauka – krok '+(step+1)+'/4</h2>'+source+mixedPicture(q.w,q.n,q.d)+'<p class="feedback">'+tips[step]+'</p>'+(step===3?equation(source,reduce?mixedDisplay(q.w,q.n,q.d):shownFraction(q.total,q.d)):'')+'<div class="controls"><button id="prev" '+(!step?'disabled':'')+'>Wstecz</button><button id="advance">'+(step===3?'Nowy przykład':'Dalej')+'</button></div></div>';$('prev').onclick=()=>{step--;render()};$('advance').onclick=()=>{if(step===3)reset();else step++;render()};return}
app.innerHTML='<div class="center"><small>Zadanie '+(index+1)+'/'+(mode==='quiz'?5:10)+'</small><h2>'+instruction+'</h2>'+equation(source,mixedInput())+'<div class="feedback '+(wrong?'bad':'good')+'" aria-live="polite">'+feedback+'</div><div class="keys">'+['7','8','9','4','5','6','1','2','3','C','0','⌫'].map(k=>'<button data-key="'+k+'" '+(locked?'disabled':'')+'>'+k+'</button>').join('')+'</div><button id="swap" '+(locked?'disabled':'')+'>Zmień pole</button><p><button class="primary" id="submit">'+(locked?'Dalej':mode==='quiz'?'Zapisz odpowiedź':'Sprawdź')+'</button></p></div>';app.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.field);render()});app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));$('swap').onclick=()=>key('swap');$('submit').onclick=()=>locked?next():checkMixed()}
document.addEventListener('keydown',e=>{if(page!=='play'||chapter===1||!['train','quiz'].includes(mode)||e.ctrlKey||e.metaKey||e.altKey)return;if(/^\d$/.test(e.key)){e.preventDefault();key(e.key)}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();key(e.key==='Delete'?'C':'⌫')}else if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();key('swap')}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();locked?next():check()}});render();
