<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ułamki</title><style>
:root{color-scheme:dark;--bg:#151b25;--panel:#222d3c;--fg:#f1f5f9;--accent:#2563eb;--line:#64748b}html.light{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--fg:#172334;--line:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px Arial,sans-serif}main{max-width:680px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #60a5fa}button:disabled{opacity:.45;cursor:default}.menu{display:grid;gap:10px}.primary{background:var(--accent);color:white;width:100%}.center{text-align:center}.figure{display:block;width:min(100%,260px);height:210px;margin:12px auto}.fraction{display:grid;width:90px;margin:12px auto;gap:4px}.fraction button{height:48px;font-size:26px;padding:4px}.fraction .active{outline:3px solid #60a5fa}.bar{height:3px;background:var(--fg)}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:10px auto}.keys button{padding:10px;font-size:22px}.feedback{min-height:44px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.good{color:#16834b}.bad{color:#e45c65}h1{font-size:26px}h2{font-size:22px}small{opacity:.75}svg [data-part]{cursor:pointer;touch-action:manipulation}</style></head><body><main><header><button id="back" aria-label="Wstecz">←</button><h1>UŁAMKI</h1><button id="settings">Opcje</button></header><section id="app"></section><footer class="center"><small>0.1.1</small></footer></main><script>
'use strict';
const app=document.querySelector('#app'),$=id=>document.getElementById(id);
const chapters=['Odczytywanie ułamków z rysunku','Zaznaczanie ułamków na rysunku','Skracanie i rozszerzanie ułamków','Ułamki niewłaściwe i liczby mieszane','Porównywanie ułamków','Dodawanie i odejmowanie ułamków','Mnożenie i dzielenie ułamków','Ułamki dziesiętne','Działania na ułamkach dziesiętnych','Zamiana ułamków','Trening mieszany'];
let page='home',previous='home',mode='',q,index=0,score=0,answers=[],values=['',''],active=0,step=0,locked=false,feedback='',wrong=false;
function theme(v){document.documentElement.classList.toggle('light',v==='light');try{localStorage.setItem('ulamki-theme',v)}catch(e){}}
try{theme(localStorage.getItem('ulamki-theme')||'dark')}catch(e){theme('dark')}
function go(p){page=p;render()}
$('back').onclick=()=>go(page==='settings'?previous:page==='home'?'home':page==='modes'?'home':'modes');
$('settings').onclick=()=>{if(page!=='settings'){previous=page;go('settings')}};
const rand=n=>Math.floor(Math.random()*n);
function question(){const shapes=['circle','rect','square'];const candidates=[];for(let d=2;d<=12;d++)for(let n=0;n<=d;n++){if(q){const prev=q.parts.filter(Boolean).length;if(n*q.d===prev*d)continue;if(Math.abs(d-q.d)<=1&&Math.abs(n-prev)<=1)continue;if(Math.abs(n/d-prev/q.d)<0.12)continue;}candidates.push({d,n})}const {d,n}=candidates[rand(candidates.length)],shape=shapes[rand(shapes.length)];const parts=Array.from({length:d},(_,i)=>i<n);if(shape==='circle'){const offset=rand(d);return {d,shape,parts:parts.map((_,i)=>parts[(i+offset)%d])}}return {d,shape,parts}}
function count(){return q.parts.filter(Boolean).length}
function reset(){q=question();values=['',''];active=0;step=0;locked=false;feedback='';wrong=false}
function start(m){mode=m;index=0;score=0;answers=[];reset();go('play')}
function figure(interactive=false){let s='';const d=q.d;for(let i=0;i<d;i++){const fill=q.parts[i]?'#438de0':'#e1e7ef',attr=' fill="'+fill+'" stroke="#64748b" stroke-width="1.5" '+(interactive?'data-part="'+i+'" tabindex="0" role="button" aria-label="Część '+(i+1)+'" aria-pressed="'+q.parts[i]+'"':'');if(q.shape==='circle'){const a=2*Math.PI*i/d-Math.PI/2,b=2*Math.PI*(i+1)/d-Math.PI/2;const pt=t=>(130+94*Math.cos(t))+','+(105+94*Math.sin(t));s+='<path d="M130,105 L'+pt(a)+' A94,94 0 0 1 '+pt(b)+' Z"'+attr+'/>'}else{const cols=q.shape==='square'&&d%3===0?3:q.shape==='square'&&d%2===0?2:d,rows=d/cols,w=q.shape==='square'?184:240,h=q.shape==='square'?184:120;s+='<rect x="'+((260-w)/2+(i%cols)*w/cols)+'" y="'+((210-h)/2+Math.floor(i/cols)*h/rows)+'" width="'+w/cols+'" height="'+h/rows+'"'+attr+'/>'}}return '<svg class="figure" viewBox="0 0 260 210" aria-label="Figura podzielona na równe części">'+s+'</svg>'}
function frac(v){return '<div class="fraction"><button id="num" aria-label="Licznik" class="'+(active===0?'active':'')+'">'+(v[0]||'?')+'</button><div class="bar"></div><button id="den" aria-label="Mianownik" class="'+(active===1?'active':'')+'">'+(v[1]||'?')+'</button></div>'}
function key(k){if(page!=='play'||locked||!['train','quiz'].includes(mode))return;if(k==='swap')active=1-active;else if(k==='C')values[active]='';else if(k==='⌫')values[active]=values[active].slice(0,-1);else if(/^\d$/.test(k))values[active]=(values[active]+k).slice(0,3);feedback='';render()}
function check(){if(locked||values.some(v=>v==='')||Number(values[1])===0){feedback='Wpisz licznik i mianownik większy od zera.';wrong=true;render();return}const ok=Number(values[0])===count()&&Number(values[1])===q.d;if(mode==='train'&&!ok){feedback='Spróbuj jeszcze raz. Policz wszystkie części i zamalowane części.';wrong=true;render();return}score+=Number(ok);answers.push({given:values.join('/'),expected:count()+'/'+q.d,ok});locked=true;feedback=mode==='quiz'?'Odpowiedź zapisana.':'Brawo! Poprawna odpowiedź.';wrong=false;render()}
function next(){index++;if(index===(mode==='quiz'?5:10)){go('result');return}reset();render()}
function render(){if(page==='home'){app.innerHTML='<h2>Wybierz dział</h2><div class="menu">'+chapters.map((c,i)=>'<button '+(i?'disabled':'id="chapter"')+'>'+ (i+1)+'. '+c+(i?' · wkrótce':'')+'</button>').join('')+'</div>';$('chapter').onclick=()=>go('modes');return}
if(page==='settings'){app.innerHTML='<h2>Opcje</h2><label>Motyw <select id="theme"><option value="dark">Ciemny</option><option value="light">Jasny</option></select></label>';$('theme').value=document.documentElement.classList.contains('light')?'light':'dark';$('theme').onchange=e=>theme(e.target.value);return}
if(page==='modes'){app.innerHTML='<h2>'+chapters[0]+'</h2><div class="menu">'+[['learn','Nauka'],['train','Zwykłe zadania'],['sandbox','Piaskownica'],['quiz','Kartkówka']].map(([m,t])=>'<button data-mode="'+m+'">'+t+'</button>').join('')+'</div>';app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));return}
if(page==='result'){app.innerHTML='<div class="center"><h2>Wynik: '+score+'/'+answers.length+'</h2>'+answers.map((a,i)=>'<p class="'+(a.ok?'good':'bad')+'">'+(i+1)+'. '+a.given+(a.ok?' ✓':' → '+a.expected)+'</p>').join('')+'<button id="again">Jeszcze raz</button></div>';$('again').onclick=()=>start(mode);return}
if(mode==='sandbox'){app.innerHTML='<div class="center"><h2>Piaskownica</h2><div class="controls"><label>Figura <select id="shape"><option value="circle">Koło</option><option value="rect">Prostokąt</option><option value="square">Kwadrat</option></select></label><label>Części <select id="parts">'+Array.from({length:11},(_,i)=>'<option>'+(i+2)+'</option>').join('')+'</select></label></div>'+figure(true)+'<p>Kliknij część, aby zmienić jej kolor.</p>'+frac([String(count()),String(q.d)])+'</div>';$('shape').value=q.shape;$('parts').value=q.d;$('shape').onchange=e=>{q.shape=e.target.value;render()};$('parts').onchange=e=>{q.d=Number(e.target.value);q.parts=Array(q.d).fill(false);render()};app.querySelectorAll('[data-part]').forEach(el=>{const toggle=()=>{q.parts[Number(el.dataset.part)]=!q.parts[Number(el.dataset.part)];render()};el.onclick=toggle;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}});return}
if(mode==='learn'){const tips=['Figura jest podzielona na równe części.','Wszystkich części jest '+q.d+'. To mianownik – zapisujemy go pod kreską.','Zamalowanych części jest '+count()+'. To licznik – zapisujemy go nad kreską.','Odczytaliśmy ułamek: '+count()+'/'+q.d+'.'];app.innerHTML='<div class="center"><h2>Nauka – krok '+(step+1)+'/4</h2>'+figure()+frac([step>=2?String(count()):'',step>=1?String(q.d):''])+'<p class="feedback">'+tips[step]+'</p><div class="controls"><button id="prev" '+(!step?'disabled':'')+'>Wstecz</button><button id="advance">'+(step===3?'Nowy przykład':'Dalej')+'</button></div></div>';$('prev').onclick=()=>{step--;render()};$('advance').onclick=()=>{if(step===3)reset();else step++;render()};return}
app.innerHTML='<div class="center"><small>Zadanie '+(index+1)+'/'+(mode==='quiz'?5:10)+'</small><h2>Jaka część figury została zamalowana?</h2>'+figure()+frac(values)+'<div class="feedback '+(wrong?'bad':'good')+'" aria-live="polite">'+feedback+'</div><div class="keys">'+['7','8','9','4','5','6','1','2','3','C','0','⌫'].map(k=>'<button data-key="'+k+'" '+(locked?'disabled':'')+'>'+k+'</button>').join('')+'</div><button id="swap" '+(locked?'disabled':'')+'>↑ ↓ Zmień pole</button><p><button class="primary" id="submit">'+(locked?'Dalej':'Sprawdź')+'</button></p></div>';$('num').onclick=()=>{if(!locked){active=0;render()}};$('den').onclick=()=>{if(!locked){active=1;render()}};$('swap').onclick=()=>key('swap');$('submit').onclick=()=>locked?next():check();app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key))}
document.addEventListener('keydown',e=>{if(page!=='play'||!['train','quiz'].includes(mode)||e.ctrlKey||e.metaKey||e.altKey)return;if(/^\d$/.test(e.key)){e.preventDefault();key(e.key)}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();key(e.key==='Delete'?'C':'⌫')}else if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();key('swap')}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();locked?next():check()}});render();
</script></body></html>
